# The alarm that survives the box it watches — idea #113, slice 1.
#
# Everything that watches this cluster runs on this cluster: one node, no
# Alertmanager, no Prometheus alerting rules, and a Web Push path whose
# three hops are all on `server1`. So the 2026-08-24 outage was silent.
#
# This job is off-box on purpose. It never asks the cluster anything —
# it could not, the ingresses are tailnet-only — it reads a ref the
# cluster force-pushes every five minutes and alarms when that stops.
#
# It lives in this repo because this repo is PUBLIC, so scheduled Actions
# here are free. That is not an incidental fact: `SokratesAI/sokrates-docs`
# had a run refused on 2026-08-21 with "recent account payments have failed
# or your spending limit needs to be increased", and a watchdog that cannot
# start is worse than no watchdog, because it looks like coverage.
name: nova-deadman

on:
  schedule:
    # A ladder of three cadences, because two 30-minute crons in a row have
    # now been scheduled by GitHub exactly zero times and the next guess
    # should be a measurement instead.
    #
    # What is measured, 2026-08-27 22:40 Oslo:
    #   * `agora-persona-runner` has had 0 scheduled runs, ever
    #     (`/actions/runs?event=schedule` -> total_count 0). The workflow is
    #     `active`, Actions `enabled` with `allowed_actions: all`, the repo
    #     public, not a fork, not archived, default branch `main`. `*/30`
    #     ran for 7h and `7,37` for 11h50m; 23+ firing opportunities, none
    #     taken.
    #   * The one schedule that does fire in this org is
    #     `sokrates-docs/agentics-maintenance.yml`, cron `37 0 * * *`. Its
    #     last 18 daily runs landed between 01:58 and 03:10 UTC -- 81 to 153
    #     minutes after the minute it asked for, every day -- and the run on
    #     2026-08-27 landed at 10:11 UTC, 9h34m late.
    #
    # So this account's scheduler is running one to two and a half hours
    # behind, and GitHub skips a scheduled occurrence that is superseded
    # before the queue reaches it. A 30-minute cron under a 90-minute delay
    # is overtaken every single time, which is a sufficient explanation for
    # a run count of zero. It is not a proven one -- I have one working
    # schedule to compare against and it is daily -- so the three crons
    # below are the experiment that settles it, and each rung is also real
    # coverage the alarm does not have today.
    #
    # How to read the result: `tools.schedule_health` reports this workflow
    # every cycle. Zero runs after 24h means the cause is not the interval
    # and is something about this repo. Roughly one run a day means only the
    # daily rung fires. Five or so means the 6-hourly rung fires too. Around
    # forty-eight means the 30-minute rung came back and the delay was
    # transient.
    #
    # The 30-minute rung stays deliberately: it costs nothing while it never
    # fires, it is the control for the whole hypothesis, and if GitHub's
    # queue recovers the alarm goes back to 30-minute latency on its own.
    - cron: "7,37 * * * *"
    - cron: "23 */6 * * *"
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nova-deadman
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is the cluster still pinging?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m tools.deadman_check
