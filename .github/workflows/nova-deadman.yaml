# The alarm that survives the box it watches — idea #113, slice 1.
#
# Everything that watches this cluster runs on this cluster: one node, no
# Alertmanager, no Prometheus alerting rules, and a Web Push path whose
# three hops are all on `server1`. So the 2026-08-24 outage was silent.
#
# This job is off-box on purpose. It never asks the cluster anything —
# it could not, the ingresses are tailnet-only — it reads a ref the
# cluster force-pushes every five minutes and alarms when that stops.
#
# It lives in this repo because this repo is PUBLIC, so scheduled Actions
# here are free. That is not an incidental fact: `SokratesAI/sokrates-docs`
# had a run refused on 2026-08-21 with "recent account payments have failed
# or your spending limit needs to be increased", and a watchdog that cannot
# start is worse than no watchdog, because it looks like coverage.
name: nova-deadman

on:
  schedule:
    # Every 30 minutes, at :07 and :37 rather than :00 and :30.
    #
    # This was `*/30 * * * *` and GitHub never scheduled it once. Measured
    # 2026-08-27 15:40 UTC, seven hours and thirteen firing opportunities
    # after the workflow was added to `main`:
    # `/actions/runs?event=schedule` answered `total_count: 0`, and the
    # workflow's only two runs ever were manual dispatches. The workflow
    # was `active`, Actions `enabled`, the repo public, and
    # `SokratesAI/sokrates-docs` had run a scheduled workflow at 10:11 UTC
    # the same morning -- so it is neither the account nor the org.
    #
    # The one difference from that working schedule is the minute: it asks
    # for `37 0 * * *` and this asked for the top and half of every hour,
    # which is where GitHub documents `schedule` as delayed under load.
    # That explains lateness, not absence, so this is an experiment rather
    # than a diagnosis -- and `tools.schedule_health` is what reads the
    # result, every cycle, instead of nobody noticing for another week.
    #
    # The cadence is unchanged and the grace inside the check is an hour,
    # so nothing about the alarm's behaviour depends on this either way.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nova-deadman
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is the cluster still pinging?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m tools.deadman_check
