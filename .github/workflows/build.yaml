name: build

on:
  push:
    branches: [main]
  pull_request:

# One pipeline at a time per branch, because update-manifest below is a blind
# `sed` of whichever digest its own run produced. Two merges to main in quick
# succession otherwise run their pipelines in parallel and the LAST one to
# finish wins -- which is not the same as the newest commit.
#
# Measured 2026-08-12 in the bridge, whose copy of this workflow is identical:
# #41 and #40 merged four seconds apart, #40 was the newer commit, and #41's
# build pushed its digest one second later and overwrote it -- pinning the
# config repo to the commit *before* the endpoint #40 had just added. Every
# check was green and the deployed pod silently served a 404 for a feature
# that was merged in main. This repo merges just as many PRs per cycle and
# has the same race; it has only been lucky with timing so far.
#
# cancel-in-progress stays false deliberately: killing a run partway through
# update-manifest is the exact failure this is meant to prevent. Queued runs
# are superseded by newer ones, so the last write is main's tip either way.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sokratesai/${{ github.event.repository.name }}
  CONFIG_REPO: SokratesAI/${{ github.event.repository.name }}-config

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for org repos —
        # the underlying gitleaks CLI is free/OSS, run that directly instead.
        #
        # This scans the whole commit HISTORY, so a credential-shaped string that
        # reaches main fails every future run on main, not just its own PR — and
        # the fix at that point is a history rewrite. That is why the failure
        # message below spells out the escape hatch: the moment to use it is now,
        # on the PR, not after merge.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact || {
            echo "::error::Secret scan failed. If the finding is a FABRICATED test fixture, append '# gitleaks:allow' to that line and push again — it is per-line, stays visible in review, and needs no config file. If it is a REAL credential: do not allowlist it, rotate it, and do not merge this branch (the scan reads history, so the leak survives deleting the line)."
            exit 1
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyyaml is test-only: tests/test_build_workflow.py parses this file
      # structurally rather than grepping it.
      - run: pip install pytest pyyaml
      - run: python -m compileall agora_runner run.py
      - run: pytest tests/ -q
      # The site's own JavaScript, run in a DOM rather than read. app.js has
      # no build step and is served to the browser exactly as written, so
      # this is the only place its behaviour can be checked at all. It runs
      # here rather than out of a scratch directory because a check that only
      # ever ran inside one cycle's session is a check nobody can repeat --
      # tests/browser/app.test.mjs names the cycle that learned that.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
        working-directory: tests/browser
      # Bounded because the failure this suite is most prone to is not a red
      # test but a hung process: a jsdom window left open keeps a rescheduling
      # poll on the event loop, every test passes, and `node --test` simply
      # never returns. Two runs sat at 33 and 52 minutes before anyone read
      # them as hung rather than slow. The suite takes ~3s, so 5 minutes turns
      # that into a red X inside the hour it happened.
      - run: node --test
        working-directory: tests/browser
        timeout-minutes: 5

  build-push:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Commits the new image digest to this service's paired config repo, which
  # ArgoCD's SCM Provider generator auto-deploys — no platform-config PR, no
  # manual step. Authenticates as a GitHub App installation, scoped by this
  # step to ONLY this repo's own -config repo (never broader). ORG_APP_ID/
  # ORG_APP_PRIVATE_KEY are repo-scoped Actions secrets that this Composition
  # itself provisions on every source repo it creates (see the
  # source-actions-secret-* resources in this Composition) — not org-level
  # secrets, which GitHub gates behind a paid plan for private repos. See
  # Platform-Product-Catalog's _context.md in the vault for why a GitHub App
  # instead of a PAT. Byte-identical across every service template instance —
  # nothing here is per-service except GitHub's own repository context, so
  # nothing needed substituting at repo-creation time.
  update-manifest:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Generate installation token scoped to the config repo only
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          owner: SokratesAI
          repositories: ${{ github.event.repository.name }}-config
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Update image digest in manifest.yaml
        run: |
          sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-push.outputs.digest }}|" manifest.yaml
          git config user.name "sokratesai-repo-committer[bot]"
          git config user.email "sokratesai-repo-committer[bot]@users.noreply.github.com"
          git add manifest.yaml
          if git diff --staged --quiet; then
            echo "no manifest change, skipping commit"
          else
            git commit -m "Update image to ${{ needs.build-push.outputs.digest }}"
            git push
          fi
