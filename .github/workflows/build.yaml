name: build

on:
  push:
    branches: [main]
  pull_request:

# One pipeline at a time per branch, because update-manifest below is a blind
# `sed` of whichever digest its own run produced. Two merges to main in quick
# succession otherwise run their pipelines in parallel and the LAST one to
# finish wins -- which is not the same as the newest commit.
#
# Measured 2026-08-12 in the bridge, whose copy of this workflow is identical.
# #41 merged at 00:18:38Z and #40 at 00:18:41Z -- three seconds apart, with
# #40 the newer of the two and carrying #41's commit 4ee2ff7 as its parent.
# Two pipelines therefore ran concurrently. agora-claude-bridge-config took
# exactly one commit out of that window, 63af6e3 at 00:20:39Z, pinning the
# deployment to sha256:dd38617... -- and the pod that came up served a 404
# for /health/database, the endpoint #40 had just added. So the deployed
# image did not contain the newer of the two merges, and every check was
# green throughout. This repo merges just as many PRs per cycle and has the
# same race; it has only been lucky with timing so far.
#
# Deliberately NOT claimed, because two primary sources disagree and this
# comment is not the place to pick a winner:
#   - which commit's build produced sha256:dd38617. The registry tags say
#     sha-4ee2ff7 -> dd38617 and sha-f36df04 -> 49201d4
#     (gh api /orgs/SokratesAI/packages/container/agora-claude-bridge/versions),
#     but the build-push job logs of BOTH runs 31549742746 and 31549746111
#     report Digest dd38617 despite different ImageIDs, which cannot be
#     right either. Unresolved; see the note in nova/resources/issues.md.
#   - which build *finished* first. An earlier draft of this comment said
#     #41's pushed "one second later". Nobody ever measured that -- it was a
#     plausible number that became a fact by being written down and copied
#     into four repositories, which is what this edit exists to undo.
#
# None of that ambiguity touches the fix: two unserialised pipelines both
# blind-`sed` the same manifest, and only one commit landed.
#
# cancel-in-progress stays false deliberately: killing a run partway through
# update-manifest is the exact failure this is meant to prevent. Queued runs
# are superseded by newer ones, so the last write is main's tip either way.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sokratesai/${{ github.event.repository.name }}
  CONFIG_REPO: SokratesAI/${{ github.event.repository.name }}-config

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for org repos —
        # the underlying gitleaks CLI is free/OSS, run that directly instead.
        #
        # This scans the whole commit HISTORY, so a credential-shaped string that
        # reaches main fails every future run on main, not just its own PR — and
        # the fix at that point is a history rewrite. That is why the failure
        # message below spells out the escape hatch: the moment to use it is now,
        # on the PR, not after merge.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact || {
            echo "::error::Secret scan failed. If the finding is a FABRICATED test fixture, append '# gitleaks:allow' to that line and push again — it is per-line, stays visible in review, and needs no config file. If it is a REAL credential: do not allowlist it, rotate it, and do not merge this branch (the scan reads history, so the leak survives deleting the line)."
            exit 1
          }
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pyyaml stopped being test-only on 2026-09-02: agora_runner imports it
      # at runtime and requirements.txt is what the image installs. Installing
      # that file rather than naming its contents here is the point -- the
      # ten-hour outage of 2026-09-02 happened because this line had pyyaml
      # and the image did not, so 5,794 tests passed against an environment
      # strictly richer than production.
      # tests/test_shipped_imports_are_installable.py is the check that
      # compares the two; pytest is the only thing here that is genuinely
      # test-only.
      - run: pip install pytest -r requirements.txt
      - run: python -m compileall agora_runner run.py
      - run: pytest tests/ -q
      # The site's own JavaScript, run in a DOM rather than read. app.js has
      # no build step and is served to the browser exactly as written, so
      # this is the only place its behaviour can be checked at all. It runs
      # here rather than out of a scratch directory because a check that only
      # ever ran inside one cycle's session is a check nobody can repeat --
      # tests/browser/app.test.mjs names the cycle that learned that.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm ci
        working-directory: tests/browser
      # Bounded because the failure this suite is most prone to is not a red
      # test but a hung process: a jsdom window left open keeps a rescheduling
      # poll on the event loop, every test passes, and `node --test` simply
      # never returns. Two runs sat at 33 and 52 minutes before anyone read
      # them as hung rather than slow. 5 minutes turns that into a red X
      # inside the hour it happened.
      #
      # That sentence used to say the suite takes ~3s, which is where the
      # 100x headroom in this bound came from. Measured 2026-08-26 on the
      # bridge pod: 71 seconds. The bound still holds, but it is 4x, not
      # 100x, so a genuinely slower suite will start hitting it.
      - run: node --test
        working-directory: tests/browser
        timeout-minutes: 5

  # agora_runner/vault.py and bridge/vault_tool.py in agora-claude-bridge are
  # two hand-written copies of one client against one CouchDB. Cycles 136-142,
  # 148, 151 and 167 each wrote the same fix into both by hand, and nothing
  # has ever noticed when one of them was missed. tools/sync_contract.py
  # compares the sixteen names that must agree -- routing, chunking, append
  # placement -- ignoring the prose around them, which differs by design.
  #
  # This is the only job that needs the other repository, so it is separate
  # from `test`: if the App token cannot reach the bridge, that failure is
  # legible on its own line instead of turning the whole unit suite red.
  # It does not gate build-push, deliberately -- drift between the two
  # clients is a fact about both repos, not a reason to stop shipping this
  # one, and a check that blocks deploys is a check somebody deletes.
  vault-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate installation token scoped to the bridge repo only
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          owner: SokratesAI
          repositories: agora-claude-bridge
      - uses: actions/checkout@v7
        with:
          repository: SokratesAI/agora-claude-bridge
          token: ${{ steps.app-token.outputs.token }}
          path: .bridge
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The CI-workflow pair is compared as parsed YAML rather than as text,
      # so this job needs pyyaml even though the other two pairs do not.
      - run: pip install pyyaml
      - run: python -m tools.sync_contract . .bridge


  build-push:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Nothing in this pipeline had ever started the image it ships, and on
      # 2026-09-02 that cost ten hours. #660 added `import yaml` to
      # agora_runner, the Dockerfile had no pip install step, and the image
      # built from it crashed every pod on startup with ModuleNotFoundError.
      # `test` was green -- it runs on a GitHub runner that has pyyaml
      # installed for its own reasons, so the suite could not see the
      # difference. This deployment is single-replica with strategy Recreate
      # and no fallback, and Nova's heartbeat runs in it, so the one thing
      # that watches this system was the thing that was down.
      #
      # This step runs the artefact that is about to be deployed, by digest,
      # not a rebuild of it. It imports every module in the package rather
      # than starting run.py, because the entrypoint needs credentials and a
      # reachable Agora while an import sweep needs neither -- measured
      # 2026-09-03: all 71 modules import with an empty environment and no
      # network. agora_runner/__init__.py re-exports tools_schemas, which
      # imports tools_kubectl_test, so `import agora_runner` alone would have
      # failed on the broken image; the sweep is here so the next missing
      # dependency does not have to be on that one path.
      #
      # It sits between the push and the digest commit deliberately. The tag
      # reaching GHCR is harmless; what deploys is the line committed below,
      # so failing here leaves the running pods on the last good digest.
      - name: Smoke-test the pushed image before anything deploys it
        run: bash .github/smoke-test.sh "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      # Commits the new image digest to this service's paired config repo, which
      # ArgoCD's SCM Provider generator auto-deploys — no platform-config PR, no
      # manual step. Authenticates as a GitHub App installation, scoped by this
      # step to ONLY this repo's own -config repo (never broader). ORG_APP_ID/
      # ORG_APP_PRIVATE_KEY are repo-scoped Actions secrets that this Composition
      # itself provisions on every source repo it creates (see the
      # source-actions-secret-* resources in this Composition) — not org-level
      # secrets, which GitHub gates behind a paid plan for private repos. See
      # Platform-Product-Catalog's _context.md in the vault for why a GitHub App
      # instead of a PAT. Byte-identical across every service template instance —
      # nothing here is per-service except GitHub's own repository context, so
      # nothing needed substituting at repo-creation time.
      #
      # This was a fourth job, `update-manifest`, until Cycle 224. It is a `sed`
      # and a `git push` — a few seconds of work billed as a whole minute on
      # every merge, because GitHub rounds per job. It only ever ran after
      # `build-push` succeeded, so running it here as that job's last step is
      # the same order for a minute less. Two things improved by accident: the
      # digest no longer travels through a job output, and a failed manifest
      # commit now reddens `build-push` instead of a job Cycle 222 discovered
      # nothing was watching.
      #
      # The config repo is checked out into `.config` rather than the workspace
      # root, because unlike the old job this one already has this repo's own
      # source checked out and must not clobber it.
      - name: Generate installation token scoped to the config repo only
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ORG_APP_ID }}
          private-key: ${{ secrets.ORG_APP_PRIVATE_KEY }}
          owner: SokratesAI
          repositories: ${{ github.event.repository.name }}-config
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: .config
      - name: Update image digest in manifest.yaml
        working-directory: .config
        run: |
          sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}|" manifest.yaml
          git config user.name "sokratesai-repo-committer[bot]"
          git config user.email "sokratesai-repo-committer[bot]@users.noreply.github.com"
          git add manifest.yaml
          if git diff --staged --quiet; then
            echo "no manifest change, skipping commit"
          else
            git commit -m "Update image to ${{ steps.build.outputs.digest }}"
            git push
          fi
