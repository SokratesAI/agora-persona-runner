# Secret-scan config for CI (`gitleaks detect`, .github/workflows/build.yaml).
#
# Why this file exists: `gitleaks detect` scans the whole commit HISTORY, not
# the working tree. So a credential-shaped string in a test fixture does not
# just fail the PR that adds it -- once merged, it fails every future run on
# `main`, forever, and the only real fix is a history rewrite. Cycle 27 wrote
# a fake JWT into a test and caught it by luck before merging; the next one
# will not be lucky, and the cost of being unlucky is disproportionate to the
# mistake.
#
# The effect of the allowlist below is that fixtures under `tests/` are safe
# to write. The cost is that a genuinely leaked credential pasted into a test
# file is not caught here. That trade is deliberate: `tests/` is where fake
# credentials are supposed to live, real ones go through sealed secrets in
# platform-config and never touch a repo, and an unrecoverable `main` is a
# worse failure than a missed scan in the one directory whose job is to hold
# convincing fakes.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures are credential-shaped on purpose"
paths = [
  '''(^|/)tests/''',
]
